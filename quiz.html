<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMMS Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
        }

        .container {
            width: 60%;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        .question {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .options {
            margin-bottom: 30px;
        }

        .options input {
            margin-right: 10px;
        }

        button {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }

        #result {
            margin-top: 20px;
        }

        #timer {
            font-size: 1.5rem;
            color: #ff5722;
            text-align: center;
        }

        .nav-buttons {
            margin-top: 20px;
            text-align: center;
        }

        .nav-buttons button {
            padding: 10px 20px;
            margin: 5px;
            background-color: #007bff;
        }

        .nav-buttons button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Timer Section -->
        <div id="timer"></div>

        <div id="question-container">
            <div class="question">
                <p id="question-text">પ્રશ્ન અહીં દર્શાવા માટે આવે છે.</p>
            </div>

            <div class="options">
                <input type="radio" id="option1" name="answer" value="A">
                <label for="option1" id="label1">વિકલ્પ 1</label><br>
                <input type="radio" id="option2" name="answer" value="B">
                <label for="option2" id="label2">વિકલ્પ 2</label><br>
                <input type="radio" id="option3" name="answer" value="C">
                <label for="option3" id="label3">વિકલ્પ 3</label><br>
                <input type="radio" id="option4" name="answer" value="D">
                <label for="option4" id="label4">વિકલ્પ 4</label><br>
            </div>

            <div class="nav-buttons">
                <button onclick="previousQuestion()">પૃષ્ઠ પાછો</button>
                <button onclick="submitAnswer()">આગળના પ્રશ્ન પર જાઓ</button>
                <button onclick="nextQuestion()">પૃષ્ઠ આગળ</button>
            </div>

            <div id="result"></div>
        </div>
    </div>

    <!-- Audio Files for sound effects -->
    <audio id="correct-sound" src="correct-answer.mp3"></audio>
    <audio id="wrong-sound" src="wrong-answer.mp3"></audio>

    <script>
        // Questions in Gujarati (50 questions added)

            { question: "ભારતની રાજધાની શું છે?", options: ["મુંબઈ", "ચેન્નાઈ", "દિલ્લી", "કોલકાતા"], correctAnswer: "દિલ્લી" },
            { question: "ભારતના સ્વતંત્રતા સંઘર્ષમાં ગાંધીજીની મહત્વપૂર્ણ ભૂમિકા કઈ હતી?", options: ["સમતાવાદ", "વિશ્વ શાંતિ", "ખેડૂત આંદોલન", "સ્વદેશનિષેડh"], correctAnswer: "સ્વદેશનિષેડh" },
            { question: "ભારતમાં કયો મહાત્મા गांधीજીના અનુયાયી હતા?", options: ["સર્દાર પટેલ", "બાબા આંબેડકર", "જવાહરલાલ નેહરુ", "સુબાસ ચંદ્ર બોઝ"], correctAnswer: "સર્દાર પટેલ" },
            { question: "ભારતની રાષ્ટ્રીય પક્ષી કયું છે?", options: ["શાહમૂછ", "મોર", "કોકાટ", "હંસ"], correctAnswer: "મોર" },
            { question: "ભારતના મુખ્ય નદીઓમાં કયો નદી નથી?", options: ["ગંગા", "બ્રહ્મપુત્ર", "તુઁગભદ્ર", "આરવિલા"], correctAnswer: "આરવિલા" },
            { question: "ભારતના સંસદનું સ્થાન ક્યાં છે?", options: ["દિલ્લી", "અમદાવાદ", "ચંદીગઢ", "મુંબઈ"], correctAnswer: "દિલ્લી" },
            { question: "ભારતના સ્વતંત્રતા પામી કયા વર્ષમાં?", options: ["1942", "1950", "1947", "1960"], correctAnswer: "1947" },
            { question: "મહાત્મા ગાંધીજીની જન્મ તારીખ કઈ છે?", options: ["2 ઓક્ટોબર 1869", "15 ઑગસ્ટ 1900", "12 ડિસેમ્બર 1880", "5 ફેબ્રુઆરી 1905"], correctAnswer: "2 ઓક્ટોબર 1869" },

            { question: "ભારતના સૌથી મોટા રાજ્ય કયા છે?", options: ["ગુજરાત", "કેમ્પલ", "રાજસ્થાન", "મધ્યપ્રદેશ"], correctAnswer: "રાજસ્થાન" },
            { question: "ઇંગ્લેન્ડના રાજાના નામ કયું છે?", options: ["કિંગ ચાર્લ્સ", "કિંગ વિલિયમ", "કિંગ એલિઝાબેથ", "કિંગ સેલ્વિન"], correctAnswer: "કિંગ ચાર્લ્સ" },
            { question: "ભારતના સૌથી વધુ વસ્તી ધરાવતું રાજ્ય કયું છે?", options: ["મહારાષ્ટ્ર", "ઉત્તર પ્રદેશ", "કર્ણાટક", "ગુજરાત"], correctAnswer: "ઉત્તર પ્રદેશ" },
            { question: "વિશ્વનું સૌથી મોટું મહાસાગર કયું છે?", options: ["એટલાંટિક", "હિન્દ મહાસાગર", "પ્રશાંત મહાસાગર", "આરctic"], correctAnswer: "પ્રશાંત મહાસાગર" },
            { question: "આગસ્ત 15 કયા દિવસની ઉજવણી છે?", options: ["ભારતીય જનતાની ઉજવણી", "સ્વાતંત્ર્ય દિવસ", "મહાત્મા ગાંધી જયંતી", "નવી વર્ષ"], correctAnswer: "સ્વાતંત્ર્ય દિવસ" },
            { question: "ભારતની પ્રથમ મહિલા પ્રધાનમંત્રી કોણ હતી?", options: ["સિંહ સોનિયા", "પ્રતિભા પાટિલ", "ઇન્દ્રા ગાંધી", "જશોધાબેન"], correctAnswer: "ઇન્દ્રા ગાંધી" },
            { question: "ભારતનું રાષ્ટ્રીય પંખી કયું છે?", options: ["હુલી હકી", "કાળો મોર", "સૂકાનું", "મોર"], correctAnswer: "મોર" },
            { question: "ભારતનો પોટેશીયલ પીઠ રકમ કયા છે?", options: ["અમદાવાદ", "વિશ્વરૂપ ચંદ્ર", "વિલિયમ વિશ્વ", "અલ્બર્ટ ટુંટ"], correctAnswer: "વિશ્વરૂપ ચંદ્ર" },
            { question: "ભારતને 'મિત્ર દેશ' કેટલા છે?", options: ["2", "3", "4", "5"], correctAnswer: "3" },
            { question: "ભારતના રાષ્ટ્રીય મહત્વપૂર્ણ સંગ્રહ કેટલા છે?", options: ["3", "4", "5", "10"], correctAnswer: "4" },
            { question: "ભારતના સૌથી જૂનાં અવશેષ કેટલા છે?", options: ["હડાપ્પા", "ઉજ્જૈન", "અવંતી", "ગુજરાત"], correctAnswer
