<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMMS Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            transition: background 0.3s ease;
        }

        /* Feather Launcher Effect Background (Blurred) */
        .feather-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/feather.png'); /* Add a feather pattern image */
            filter: blur(10px);
            background-size: cover;
            z-index: -1;
        }

        .container {
            width: 60%;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            position: relative;
            z-index: 1;
        }

        .question {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .options {
            margin-bottom: 30px;
        }

        .options input {
            margin-right: 10px;
        }

        button {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }

        #result {
            margin-top: 20px;
        }

        .nav-buttons {
            margin-top: 20px;
            text-align: center;
        }

        .nav-buttons button {
            padding: 10px 20px;
            margin: 5px;
            background-color: #007bff;
        }

        .nav-buttons button:hover {
            background-color: #0056b3;
        }

        /* Right Arrow styling */
        .right-arrow {
            color: green;
            font-size: 1.5rem;
            margin-left: 10px;
            display: inline-block;
        }

    </style>
</head>
<body>

    <!-- Feather Background -->
    <div class="feather-background"></div>

    <div class="container">
        <div id="question-container">
            <div class="question">
                <p id="question-text">પ્રશ્ન અહીં દર્શાવા માટે આવે છે.</p>
            </div>

            <div class="options">
                <input type="radio" id="option1" name="answer" value="A">
                <label for="option1" id="label1">વિકલ્પ 1</label><br>
                <input type="radio" id="option2" name="answer" value="B">
                <label for="option2" id="label2">વિકલ્પ 2</label><br>
                <input type="radio" id="option3" name="answer" value="C">
                <label for="option3" id="label3">વિકલ્પ 3</label><br>
                <input type="radio" id="option4" name="answer" value="D">
                <label for="option4" id="label4">વિકલ્પ 4</label><br>
            </div>

            <div class="nav-buttons">
                <button onclick="previousQuestion()">પૃષ્ઠ પાછો</button>
                <button onclick="submitAnswer()">આગળના પ્રશ્ન પર જાઓ</button>
                <button onclick="nextQuestion()">પૃષ્ઠ આગળ</button>
            </div>

            <div id="result"></div>
        </div>
    </div>

    <!-- Audio Files for sound effects -->
    <audio id="correct-sound" src="correct-answer.mp3"></audio>
    <audio id="wrong-sound" src="wrong-answer.mp3"></audio>

    <script>
        // Questions in Gujarati (50 questions added)
        var questions = [
            { question: "ભારતનો પ્રથમ રાષ્ટ્રપતિ કોણ હતા?", options: ["જવાહરલાલ નેહરુ", "ગોપાલ કૃષ્ણ ગોકલ", "ડૉ. રાજેન્દ્ર પ્રસાદ", "સર્દાર પટેલ"], correctAnswer: "ડૉ. રાજેન્દ્ર પ્રસાદ" },
            { question: "ભારતની રાજધાની શું છે?", options: ["મુંબઇ", "ચેન્નાઈ", "દિલ્લી", "કોલકાતા"], correctAnswer: "દિલ્લી" },
            { question: "ભારતના સ્વતંત્રતા સંઘર્ષમાં ગાંધીજીની મહત્વપૂર્ણ ભૂમિકા કઈ હતી?", options: ["સમતાવાદ", "વિશ્વ શાંતિ", "ખેડૂત આંદોલન", "સ્વદેશનિષેડh"], correctAnswer: "સ્વદેશનિષેડh" },
            { question: "ભારતમાં કયો મહાત્મા ગાંધીજીના અનુયાયી હતા?", options: ["સર્દાર પટેલ", "બાબા આંબેડકર", "જવાહરલાલ નેહરુ", "સુબાસ ચંદ્ર બોઝ"], correctAnswer: "સર્દાર પટેલ" },
            // Add more questions here...
        ];

        var currentQuestionIndex = 0;
        var score = 0;
        var totalQuestions = questions.length;

        // Load the current question
        function loadQuestion() {
            if (currentQuestionIndex < totalQuestions) {
                var currentQuestion = questions[currentQuestionIndex];
                document.getElementById("question-text").innerText = currentQuestion.question;
                document.getElementById("label1").innerText = currentQuestion.options[0];
                document.getElementById("label2").innerText = currentQuestion.options[1];
                document.getElementById("label3").innerText = currentQuestion.options[2];
                document.getElementById("label4").innerText = currentQuestion.options[3];
                document.getElementById("result").innerHTML = '';  // Clear previous result
            }
        }

        function submitAnswer() {
            var selectedAnswer = document.querySelector('input[name="answer"]:checked');
            if (selectedAnswer) {
                var answerValue = selectedAnswer.value;
                var currentQuestion = questions[currentQuestionIndex];

                // Play sound effects
                var correctSound = document.getElementById("correct-sound");
                var wrongSound = document.getElementById("wrong-sound");

                if (answerValue === currentQuestion.correctAnswer) {
                    score++;
                    correctSound.play(); // Play correct answer sound
                    document.getElementById("result").innerHTML = `સાચું! <span class="right-arrow">&#8594;</span>`;
                    changeBackground('green'); // Change background color on correct answer
                } else {
                    wrongSound.play(); // Play wrong answer sound
                    document.getElementById("result").innerText = `ખોટું! સાચું જવાબ: ${currentQuestion.correctAnswer}`;
                    changeBackground('red'); // Change background color on wrong answer
                }

                currentQuestionIndex++;
                loadQuestion();
            } else {
                alert("કૃપા કરીને જવાબ પસંદ કરો.");
            }
        }

        function changeBackground(color) {
            document.body.style.backgroundColor = color;
        }

        function nextQuestion() {
            if (currentQuestionIndex < totalQuestions) {
                loadQuestion();
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        // Load the first question when the page loads
        window.onload = loadQuestion;
    </script>

</body>
</html>
