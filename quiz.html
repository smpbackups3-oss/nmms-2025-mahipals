<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMMS પ્રેક્ટિસ પ્રશ્નો</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
        }
        .question {
            margin-bottom: 20px;
        }
        .question p {
            font-size: 18px;
        }
        .answers input {
            margin-right: 10px;
        }
        .submit-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        .submit-btn:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>NMMS પ્રેક્ટિસ પ્રશ્નો</h1>

    <form id="quizForm">
        <!-- Question 1 -->
        <div class="question">
            <p>1. ભારતમાં રાજધાની કઈ છે?</p>
            <div class="answers">
                <label><input type="radio" name="q1" value="a"> દિલ્હી</label><br>
                <label><input type="radio" name="q1" value="b"> મુંબઈ</label><br>
                <label><input type="radio" name="q1" value="c"> કોલકાતા</label><br>
                <label><input type="radio" name="q1" value="d"> બંગલોર</label>
            </div>
        </div>

        <!-- Question 2 -->
        <div class="question">
            <p>2. વિજળીના બલ્બને કોણે શોધી?</p>
            <div class="answers">
                <label><input type="radio" name="q2" value="a"> આલ્બર્ટ આઇન્સટાઇન</label><br>
                <label><input type="radio" name="q2" value="b"> નિકોલા ટેસ્લા</label><br>
                <label><input type="radio" name="q2" value="c"> થોમસ એડીસન</label><br>
                <label><input type="radio" name="q2" value="d"> એલેકઝાન્ડર ગ્રેહમ બેલ</label>
            </div>
        </div>

        <!-- Question 3 -->
        <div class="question">
            <p>3. ગુરુ નાનક દેવજીનો જન્મ ક્યા સ્થળે થયો હતો?</p>
            <div class="answers">
                <label><input type="radio" name="q3" value="a"> અમૃતસર</label><br>
                <label><input type="radio" name="q3" value="b"> પાકિસ્તાન</label><br>
                <label><input type="radio" name="q3" value="c"> લાહોર</label><br>
                <label><input type="radio" name="q3" value="d"> હાર્દ્વાર</label>
            </div>
        </div>

        <!-- Question 4 -->
        <div class="question">
            <p>4. "ભારતીય સાવચેતી" ના રાષ્ટ્રીય પૂજારાને કોણે સ્થાપના કરી?</p>
            <div class="answers">
                <label><input type="radio" name="q4" value="a"> સુરાજ નાથ</label><br>
                <label><input type="radio" name="q4" value="b"> ચંદ્રશેખર આઝાદ</label><br>
                <label><input type="radio" name="q4" value="c"> લાલા લજપત રાય</label><br>
                <label><input type="radio" name="q4" value="d"> સરદાર પટેલ</label>
            </div>
        </div>

        <!-- Question 5 -->
        <div class="question">
            <p>5. કોણ છે જેમણે "બાપુ" ના ઉપનામ સાથે ઓળખાય છે?</p>
            <div class="answers">
                <label><input type="radio" name="q5" value="a"> જેવહરલાલ નેહરુ</label><br>
                <label><input type="radio" name="q5" value="b"> મહાત્મા ગાંધી</label><br>
                <label><input type="radio" name="q5" value="c"> બિનોદ ભવન</label><br>
                <label><input type="radio" name="q5" value="d"> સરદાર પટેલ</label>
            </div>
        </div>

        <!-- Submit Button -->
        <button type="button" class="submit-btn" onclick="checkAnswers()">જવાબ મોકલો</button>
    </form>

    <div class="result" id="result"></div>
</div>

<script>
    // Correct answers for each question
    const correctAnswers = {
        q1: "a",  // Delhi
        q2: "c",  // Thomas Edison
        q3: "b",  // Pakistan
        q4: "c",  // Lala Lajpat Rai
        q5: "b",  // Mahatma Gandhi
        // Add other correct answers here
    };

    function checkAnswers() {
        let score = 0;
        const form = document.getElementById("quizForm");
        const resultDiv = document.getElementById("result");

        // Loop through each question and check if the selected answer is correct
        for (let i = 1; i <= 5; i++) {  // Update '5' to number of questions
            const selectedAnswer = form.querySelector(`input[name="q${i}"]:checked`);
            if (selectedAnswer && selectedAnswer.value === correctAnswers[`q${i}`]) {
                score++;
            }
        }

        // Display result
        resultDiv.innerHTML = `તમારા 5 પૈકી ${score} સવાલો સાચા છે.`;
    }
</script>

</body>
</html>
